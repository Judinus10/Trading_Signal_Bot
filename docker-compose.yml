services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: signals
      POSTGRES_USER: signals
      POSTGRES_PASSWORD: signals
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signals"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  web:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://signals:signals@db:5432/signals
      REDIS_URL: redis://redis:6379/0
    ports: ["8000:8000"]
    volumes: [model_artifacts:/app/artifacts]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
  worker:
    build: .
    command: celery -A config worker -l INFO
    env_file: .env
    environment:
      DATABASE_URL: postgresql://signals:signals@db:5432/signals
      REDIS_URL: redis://redis:6379/0
    volumes: [model_artifacts:/app/artifacts]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
  beat:
    build: .
    command: celery -A config beat -l INFO
    env_file: .env
    environment:
      DATABASE_URL: postgresql://signals:signals@db:5432/signals
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
volumes:
  postgres_data:
  model_artifacts:
